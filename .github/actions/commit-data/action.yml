name: Commit synced data
description: >
  Commit and push a refreshed data file when it changed. Sets `changed` output to "true" only when a commit was made, so a downstream deploy job can gate on it.

inputs:
  paths:
    description: Space-separated file paths to stage and commit
    required: true
  message:
    description: Commit message (Conventional Commits)
    required: true

outputs:
  changed:
    description: '"true" when a commit was pushed, empty otherwise'
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - id: commit
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.message }}
      run: |
        if ! git diff --quiet -- $PATHS; then
          git config user.name "andrewmcodes-bot"
          git config user.email "bot@andrewm.codes"
          git add $PATHS
          git commit -m "$MESSAGE"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
