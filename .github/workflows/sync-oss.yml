name: Sync OSS projects
on:
  schedule: [{ cron: "0 14 * * *" }]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      # GraphQL supplies primaryLanguage.color, which gh repo list omits.
      - env:
          GH_TOKEN: ${{ secrets.OSS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          gh api graphql --paginate -f query='
            query($endCursor: String) {
              user(login: "andrewmcodes") {
                repositories(
                  first: 100
                  after: $endCursor
                  privacy: PUBLIC
                  isFork: false
                  ownerAffiliations: OWNER
                  orderBy: { field: PUSHED_AT, direction: DESC }
                ) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    name description url stargazerCount forkCount pushedAt isArchived
                    primaryLanguage { name color }
                  }
                }
              }
            }' --jq '.data.user.repositories.nodes[]' \
            | jq -s 'map(select(.isArchived == false) | del(.isArchived))
                     | sort_by(.pushedAt) | reverse' > /tmp/oss.json

      - name: Validate shape
        run: |
          set -euo pipefail
          # Reject auth/schema failures and suspiciously truncated results.
          jq -e 'type == "array" and length >= 20 and all(.name? and .url? and .pushedAt?)' /tmp/oss.json > /dev/null \
            || { echo "::error::oss.json failed shape validation"; exit 1; }
          mv /tmp/oss.json src/_data/oss.json

      - uses: ./.github/actions/commit-data
        id: commit
        with:
          paths: src/_data/oss.json
          message: "chore(data): refresh OSS projects"

  deploy:
    name: deploy to cloudflare
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the refreshed data the sync job just pushed, not the stale trigger SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/deploy-production
        with:
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cloudflare-email: ${{ secrets.CLOUDFLARE_EMAIL }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
