name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so commitlint can see the full commit range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - parallel:
          - name: standardrb
            run: bundle exec standardrb
          - name: typecheck
            run: pnpm run typecheck
          - name: steep
            run: bundle exec steep check --jobs=1
          - name: minitest
            run: bundle exec rake test
          - name: commitlint
            run: |
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                pnpm exec commitlint \
                  --from "${{ github.event.pull_request.base.sha }}" \
                  --to "${{ github.event.pull_request.head.sha }}" \
                  --verbose
              else
                pnpm exec commitlint --last --verbose
              fi

  build:
    name: production build
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.mark.outputs.built }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - env:
          BRIDGETOWN_ENV: production
        run: bin/bridgetown deploy
      - id: mark
        run: echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Upload build output
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v7
        with:
          name: site-output
          path: output
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: deploy to cloudflare
    runs-on: ubuntu-latest
    needs: [checks, build]
    # Dependabot and fork PRs cannot access Cloudflare secrets.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          ruby: "false"
      - uses: actions/download-artifact@v8
        with:
          name: site-output
          path: output

      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Compute preview alias
        if: github.event_name == 'pull_request'
        id: alias
        run: |
          raw="pr-${{ github.event.pull_request.number }}-${{ github.head_ref }}"
          slug=$(printf '%s' "$raw" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-+|-+$//g' \
            | cut -c1-40 \
            | sed -E 's/-+$//')
          echo "alias=$slug" >> "$GITHUB_OUTPUT"

      # Preview social images here; canonical and og:url stay on production.
      - name: Rewrite OG image URLs for preview
        if: github.event_name == 'pull_request'
        env:
          # Account-level value from Workers & Pages → Settings → Subdomain.
          CF_WORKERS_SUBDOMAIN: andrewmcodes
        run: |
          worker_name=$(jq -r '.name' wrangler.jsonc)
          preview_host="${{ steps.alias.outputs.alias }}-${worker_name}.${CF_WORKERS_SUBDOMAIN}.workers.dev"
          echo "Rewriting og:image hosts → https://${preview_host}/og/"
          find output -name '*.html' -print0 \
            | xargs -0 sed -i "s#https://andrewm.codes/og/#https://${preview_host}/og/#g"

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.alias }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_OUTPUT: ${{ steps.preview.outputs.command-output }}
          PREVIEW_STDERR: ${{ steps.preview.outputs.command-stderr }}
        run: |
          # Prefer the stable alias URL; fall back to the version URL.
          combined=$(printf '%s\n%s\n' "$PREVIEW_OUTPUT" "$PREVIEW_STDERR")
          url=$(printf '%s\n' "$combined" \
            | sed -nE 's#.*Version Preview Alias URL:[[:space:]]+(https://[A-Za-z0-9.-]+\.workers\.dev).*#\1#p' \
            | head -1)
          if [ -z "$url" ]; then
            url=$(printf '%s\n' "$combined" \
              | sed -nE 's#.*Version Preview URL:[[:space:]]+(https://[A-Za-z0-9.-]+\.workers\.dev).*#\1#p' \
              | head -1)
          fi
          body="Preview: ${url:-(URL could not be extracted from wrangler output)}"
          gh pr comment "$PR_NUMBER" --body "$body" --edit-last 2>/dev/null \
            || gh pr comment "$PR_NUMBER" --body "$body"
