name: Sync latest Remote Ruby episode
on:
  schedule: [{ cron: "0 13 * * *" }]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Fetch latest episode from Buzzsprout
        env:
          BUZZSPROUT_API_TOKEN: ${{ secrets.BUZZSPROUT_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Token token=\"$BUZZSPROUT_API_TOKEN\"" \
            https://www.buzzsprout.com/api/2260490/episodes.json \
            > /tmp/episodes.json
          node .github/scripts/parse-remote-ruby.mjs /tmp/episodes.json > /tmp/remote_ruby.json

      - name: Validate shape
        run: |
          set -euo pipefail
          jq -e '.id and .title and .url and .published_at' /tmp/remote_ruby.json > /dev/null \
            || { echo "::error::remote_ruby.json missing required keys"; exit 1; }
          mv /tmp/remote_ruby.json src/_data/remote_ruby.json

      - uses: ./.github/actions/commit-data
        id: commit
        with:
          paths: src/_data/remote_ruby.json
          message: "chore(data): refresh latest Remote Ruby episode"

  deploy:
    name: deploy to cloudflare
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the refreshed data the sync job just pushed, not the stale trigger SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/deploy-production
        with:
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cloudflare-email: ${{ secrets.CLOUDFLARE_EMAIL }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
